    <meta

      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint so there is no flash -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

  </body>
